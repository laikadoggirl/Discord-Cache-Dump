# .github/workflows/go.yml
name: Go

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build-ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true
      - name: Download modules
        run: go mod download
      - name: Build
        run: go build -v ./...
      - name: Test
        run: go test -v ./...

  build-arch:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Prepare container (update, minimal tools)
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm git ca-certificates
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true
      - name: Mark workspace safe for Git (fix 'dubious ownership')
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          # Or allow any path in CI (broader):
          # git config --global --add safe.directory '*'
      - name: Download modules
        run: go mod download
      - name: Build
        run: go build -v ./...
      - name: Test
        run: go test -v ./...
